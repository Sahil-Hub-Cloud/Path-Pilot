name: Security Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npx eslint . --ext .ts,.tsx --rule '{ "no-console": ["warn", { "allow": ["warn", "error"] }] }'
        continue-on-error: true
      - run: npx secretlint "**/*"
        continue-on-error: true
